<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aria · Agent de vente IA — NovaTech</title>
  <meta name="description" content="Agent de vente IA : découverte, présentation, traitement des objections et capture de leads — en direct." />
  <link rel="stylesheet" href="/demo/chat.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>Aria <span class="sub">· Agent de vente IA — NovaTech</span> <span id="stateBadge" class="badge">Prise de contact</span></h1>
          <p class="status"><span class="dot"></span> En ligne — répond en quelques secondes</p>
        </div>
      </div>
      <button id="resetBtn" class="ghost" type="button">↺ Nouvelle conversation</button>
    </header>

    <main id="chat" aria-live="polite" aria-label="Conversation"></main>

    <section id="leadWrap" class="lead-form hidden">
      <h3>📩 Recevoir la démo</h3>
      <form id="leadForm">
        <input id="leadName" name="name" placeholder="Votre nom *" autocomplete="name" required />
        <input id="leadEmail" name="email" type="email" placeholder="Votre e-mail professionnel *" autocomplete="email" required />
        <input id="leadPhone" name="phone" placeholder="Téléphone (optionnel)" autocomplete="tel" />
        <button type="submit">Envoyer mes coordonnées</button>
      </form>
    </section>

    <div id="quick" class="quick" aria-label="Réponses rapides"></div>

    <form id="inputForm" class="inputbar">
      <input id="msgInput" autocomplete="off" placeholder="Écrivez votre message…" aria-label="Votre message" />
      <button type="submit" aria-label="Envoyer">➤</button>
    </form>

    <footer>Démonstration — les leads saisis sont enregistrés dans <code>data/leads.json</code> sur le serveur.</footer>
  </div>
  <script src="/demo/chat.js"></script>
</body>
</html>
